<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お買い物リスト</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4fe3c1">

  <link rel="stylesheet" href="style.css">

  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="買い物リスト">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>

<div style="text-align: right;">
  <button id="themeToggle" style="background:none; border:none; cursor:pointer; font-size: 24px;">🌙</button>
</div>    
<h1>🛒 お買い物リスト</h1>

<div class="create-list">
  <input type="text" id="dateInput" placeholder="年/月/日" 
         onfocus="(this.type='date')" 
         onblur="if(!this.value)this.type='text'">
  <input type="text" id="shopInput" placeholder="お店の名前">
  <button id="createListBtn">リスト作成</button>
</div>

<div id="lists"></div>

<script src="script.js"></script>
</body>
</html>
